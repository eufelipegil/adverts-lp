<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050B1A">
<title>Diagnóstico do topo</title>
<style>
  html,body{margin:0;background:#050B1A;color:#fff;font:15px/1.5 -apple-system,system-ui,sans-serif}
  /* faixa vermelha: encostada em top:0 do layout (fixed) */
  .r{position:fixed;top:0;left:0;right:0;height:6px;background:#f00;z-index:9}
  /* barra azul: imita a navbar, fixa, com o notch somado */
  .n{position:fixed;top:0;left:0;right:0;z-index:8;height:calc(72px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);background:rgba(0,140,220,.55);display:flex;align-items:center;padding-left:16px;box-sizing:border-box}
  /* faixa verde: sticky top:0 (comparar com fixed) */
  .s{position:sticky;top:0;height:6px;background:#0f0;z-index:7}
  .sonda{position:absolute;visibility:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .pad{height:120px}
  pre{white-space:pre-wrap;margin:0 16px;font:14px/1.6 ui-monospace,Menlo,monospace}
  .bloco{height:900px;background:repeating-linear-gradient(180deg,#123 0 60px,#345 60px 120px);margin-top:16px}
  h1{font-size:18px;margin:0 16px 8px}
</style>
</head>
<body>
<div class="r"></div>
<div class="n"><b>NAVBAR DE TESTE (fixed)</b></div>
<div class="sonda" id="sonda"></div>
<div class="pad"></div>
<div class="s"></div>
<h1>Tire um print desta tela e mande</h1>
<pre id="o">carregando…</pre>
<div class="bloco"></div>
<script>
function ler(){
  var s=document.getElementById('sonda'), cs=getComputedStyle(s);
  var vv=window.visualViewport||{};
  var r=document.querySelector('.r').getBoundingClientRect();
  var n=document.querySelector('.n').getBoundingClientRect();
  var st=document.querySelector('.s').getBoundingClientRect();
  var ua=navigator.userAgent;
  var nav=/CriOS/.test(ua)?'Chrome iOS':/FxiOS/.test(ua)?'Firefox iOS':/Instagram|FBAN|FBAV/.test(ua)?'App (Insta/FB)':/Safari/.test(ua)?'Safari':'outro';
  var standalone=(window.navigator.standalone===true)||matchMedia('(display-mode: standalone)').matches;
  var t=[
   'navegador: '+nav+(standalone?' (tela inicial)':''),
   'safe-area top: '+cs.paddingTop,
   'safe-area bottom: '+cs.paddingBottom,
   'innerHeight: '+innerHeight+'  innerWidth: '+innerWidth,
   'screen: '+screen.width+' x '+screen.height,
   'vv.offsetTop: '+(vv.offsetTop!=null?vv.offsetTop.toFixed(1):'-')+'  vv.pageTop: '+(vv.pageTop!=null?vv.pageTop.toFixed(1):'-'),
   'vv.height: '+(vv.height!=null?vv.height.toFixed(1):'-')+'  scale: '+(vv.scale||'-'),
   'scrollY: '+Math.round(scrollY),
   'faixa vermelha (fixed) top: '+r.top.toFixed(1),
   'barra azul (fixed) top: '+n.top.toFixed(1)+'  altura: '+n.height.toFixed(1),
   'faixa verde (sticky) top: '+st.top.toFixed(1),
   'theme-color: #050B1A'
  ];
  document.getElementById('o').textContent=t.join('\n');
}
ler(); addEventListener('scroll',ler,{passive:true}); addEventListener('resize',ler);
if(window.visualViewport){visualViewport.addEventListener('resize',ler);visualViewport.addEventListener('scroll',ler);}
</script>
</body>
</html>
