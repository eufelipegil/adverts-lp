# A cada push na main: compila o Astro e publica o resultado (dist/) na branch "deploy".
# O cPanel da StayCloud puxa essa branch e copia para o public_html (ver .cpanel.yml).
name: Build e publicar na branch deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # IDs de rastreamento entram no build. Cadastre em Settings > Secrets and variables > Actions > Variables.
      - run: npm run build
        env:
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
          PUBLIC_GADS_ID: ${{ vars.PUBLIC_GADS_ID }}
          PUBLIC_GADS_CONV_LABEL: ${{ vars.PUBLIC_GADS_CONV_LABEL }}
          PUBLIC_META_PIXEL_ID: ${{ vars.PUBLIC_META_PIXEL_ID }}
          PUBLIC_WIDZ_TRACK: ${{ vars.PUBLIC_WIDZ_TRACK }}

      # Commit normal por cima da branch deploy (sem force push), para o git pull do cPanel nunca divergir.
      - name: Publicar dist/ na branch deploy
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads "$REPO_URL" deploy >/dev/null 2>&1; then
            git clone --depth 1 --branch deploy "$REPO_URL" "$RUNNER_TEMP/deploy"
          else
            git init -b deploy "$RUNNER_TEMP/deploy"
            git -C "$RUNNER_TEMP/deploy" remote add origin "$REPO_URL"
          fi
          cd "$RUNNER_TEMP/deploy"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$GITHUB_WORKSPACE/dist/." .
          cp "$GITHUB_WORKSPACE/.cpanel.yml" .cpanel.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou no site compilado."
          else
            git commit -m "Deploy ${GITHUB_SHA::7}"
            git push origin deploy
          fi
