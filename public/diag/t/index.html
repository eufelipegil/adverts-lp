<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Teste do topo</title>
<style>
  @property --bg { syntax: '<color>'; inherits: true; initial-value: #050B1A; }
  html{margin:0}
  body{margin:0;font:16px/1.4 -apple-system,system-ui,sans-serif;color:#fff}
  .strip{position:fixed;top:0;left:0;right:0;height:8px;z-index:100}
  .hdr{position:fixed;top:0;left:0;right:0;height:72px;z-index:50;background:#050B1A;display:none;align-items:center;padding-left:16px;box-sizing:border-box}
  .info{position:relative;padding:90px 16px 16px;background:#222}
  .info b{font-size:22px;display:block}
  .banda{height:150px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#000}
  .banda:nth-child(odd){background:#ffe14d}.banda:nth-child(even){background:#7fe0ff}
  nav{padding:10px 16px;background:#eee;color:#000}
  nav a{display:inline-block;margin:4px 10px 4px 0;padding:8px 12px;background:#000;color:#fff;border-radius:8px;text-decoration:none}
</style>
<style id="v"></style>
</head>
<body>
<div class="strip" id="strip"></div>
<div class="hdr" id="hdr">NAVBAR (v4)</div>
<div class="info"><b id="t">…</b><span id="d"></span></div>
<nav>Abra cada teste e tire print do TOPO:<br>
<a href="?v=1">1</a><a href="?v=2">2</a><a href="?v=3">3</a><a href="?v=4">4</a><a href="?v=5">5</a></nav>
<div class="banda">amarelo</div><div class="banda">azul</div><div class="banda">amarelo</div><div class="banda">azul</div><div class="banda">amarelo</div><div class="banda">azul</div><div class="banda">amarelo</div><div class="banda">azul</div>
<script>
var v=(location.search.match(/v=(\d)/)||[0,'1'])[1];
var D={
 1:['Teste 1: faixa 8px AZUL MARINHO simples','cor #050B1A direto, sem variável, sem overflow'],
 2:['Teste 2: faixa 8px VERMELHA + overflow-x: clip','igual ao teste que funcionou, mais overflow-x:clip em html e body (como o site)'],
 3:['Teste 3: faixa 8px azul marinho com variável CSS e transição','cor vem de var(--bg), body com transition como o site'],
 4:['Teste 4: azul marinho + navbar opaca 72px por baixo + overflow clip','combinação mais parecida com o site'],
 5:['Teste 5: faixa 8px VERMELHA simples (controle)','sem nada do site; deve pintar o relógio de vermelho']
};
var css={
 1:'.strip{background:#050B1A}',
 2:'html,body{overflow-x:clip}.strip{background:#f00}',
 3:':root{--bg:#050B1A}body{background:var(--bg);transition:--bg .6s}.strip{background:var(--bg)}',
 4:'html,body{overflow-x:clip}.strip{background:#050B1A}.hdr{display:flex}',
 5:'.strip{background:#f00}'
};
document.getElementById('v').textContent=css[v]||css[1];
document.getElementById('t').textContent=(D[v]||D[1])[0];
document.getElementById('d').textContent=(D[v]||D[1])[1];
</script>
</body>
</html>
